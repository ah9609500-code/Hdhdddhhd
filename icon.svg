<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#047857" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- App Icon Background (Squircle / Rounded Container) -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)" />

  <!-- Subtle Inner Glow Ring -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Medical Cross / Shield Backdrop -->
  <g filter="url(#shadow)">
    <!-- Central Modern Pharmacy Cross -->
    <rect x="216" y="120" width="80" height="272" rx="28" fill="#ffffff" />
    <rect x="120" y="216" width="272" height="80" rx="28" fill="#ffffff" />

    <!-- Center Accent Pill / Crescent Emblem -->
    <circle cx="256" cy="256" r="44" fill="#047857" />

    <!-- Bowl of Hygieia / Mortar & Snake or Medical Pulse icon in center -->
    <path d="M242 242 L250 256 L256 246 L262 264 L270 256" fill="none" stroke="#34d399" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Arabic Pharmacy Calligraphy Hint / Subtitle Arc -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="4" stroke-dasharray="12 10" />

  <!-- Small Plus Sparkles -->
  <path d="M380 140 L380 160 M370 150 L390 150" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" />
  <path d="M130 360 L130 380 M120 370 L140 370" stroke="#a7f3d0" stroke-width="4" stroke-linecap="round" />
</svg>
